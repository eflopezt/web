{% extends "base.html" %}
{% block title %}Cambiar contraseña — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-10 max-w-md">
  <div class="card bg-base-100 border border-base-300"><div class="card-body">
    <h1 class="text-xl font-bold">Cambiar contraseña</h1>
    <form method="post" class="space-y-3 mt-3">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-full">Actualizar contraseña</button>
    </form>
  </div></div>
</div>
<style>form input{@apply input input-bordered w-full mt-1;}</style>
{% endblock %}
