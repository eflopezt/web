<div class="bg-primary text-primary-content text-xs">
  <div class="container mx-auto px-4 py-1.5 flex flex-wrap items-center justify-between gap-2">
    <span>📞 {{ SITE_PHONE }} · ✉ {{ SITE_EMAIL }}</span>
    <span class="hidden md:inline">Envíos a todo el Perú · Atención de lunes a sábado</span>
  </div>
</div>

<header class="bg-base-100 border-b border-base-300 sticky top-0 z-40 shadow-sm">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between gap-4 h-16">
      {% include "components/_logo.html" %}

      <form action="{% url 'catalogo:lista' %}" method="get" class="hidden md:flex flex-1 max-w-xl">
        <input type="search" name="q" placeholder="¿Qué producto buscas? (detergente, desinfectante, papel toalla...)"
               class="input input-bordered w-full rounded-r-none focus:outline-none focus:border-primary" />
        <button type="submit" class="btn btn-primary rounded-l-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        </button>
      </form>

      <nav class="flex items-center gap-1">
        <a href="{% url 'catalogo:lista' %}" class="btn btn-ghost btn-sm hidden lg:inline-flex">Catálogo</a>
        <a href="{% url 'core:nosotros' %}" class="btn btn-ghost btn-sm hidden lg:inline-flex">Nosotros</a>
        <a href="{% url 'core:contacto' %}" class="btn btn-ghost btn-sm hidden lg:inline-flex">Contacto</a>

        <button type="button"
                onclick="document.getElementById('drawer-carrito').showModal()"
                hx-get="{% url 'cotizaciones:drawer' %}"
                hx-target="#drawer-carrito-content"
                hx-swap="innerHTML"
                class="btn btn-primary btn-sm gap-2 relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
          <span class="hidden sm:inline">Cotizar</span>
          {% include "cotizaciones/_badge.html" %}
        </button>
      </nav>
    </div>

    <form action="{% url 'catalogo:lista' %}" method="get" class="md:hidden pb-3">
      <div class="flex">
        <input type="search" name="q" placeholder="Buscar productos..." class="input input-bordered input-sm w-full rounded-r-none" />
        <button type="submit" class="btn btn-primary btn-sm rounded-l-none">Buscar</button>
      </div>
    </form>
  </div>
</header>
