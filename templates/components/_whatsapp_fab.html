<div x-data="{ open: false }" class="fixed bottom-5 right-5 z-50 print:hidden">
  <div x-show="open" x-transition x-cloak class="mb-3 w-72 card bg-base-100 border border-base-300 shadow-xl">
    <div class="card-body p-4">
      <div class="flex items-start gap-3">
        <div class="avatar placeholder">
          <div class="bg-success text-success-content rounded-full w-12">
            <svg viewBox="0 0 24 24" class="w-7 h-7" fill="currentColor"><path d="M20.5 3.5A11.6 11.6 0 0 0 12 0C5.4 0 .1 5.3.1 11.9c0 2.1.6 4.2 1.6 6L0 24l6.3-1.7c1.7.9 3.7 1.4 5.6 1.4 6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.3-8.3z"/></svg>
          </div>
        </div>
        <div class="flex-1">
          <div class="font-bold text-sm">{{ SITE_NAME }} Ventas</div>
          <div class="text-xs text-success flex items-center gap-1"><span class="w-2 h-2 bg-success rounded-full animate-pulse"></span> En línea</div>
        </div>
        <button @click="open=false" class="btn btn-xs btn-circle btn-ghost">✕</button>
      </div>
      <div class="mt-3 bg-base-200 rounded-lg p-3 text-sm">
        ¡Hola! 👋 ¿En qué podemos ayudarte? Cotizaciones, soporte o consultas técnicas.
      </div>
      <a href="https://wa.me/{{ SITE_WHATSAPP }}?text=Hola%2C%20vengo%20de%20la%20web%20de%20{{ SITE_NAME|urlencode }}." target="_blank" rel="noopener" class="btn btn-success btn-sm mt-3 gap-2 w-full">
        Iniciar conversación
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
      </a>
    </div>
  </div>

  <button @click="open=!open" class="btn btn-success btn-circle shadow-lg w-14 h-14 relative">
    <svg viewBox="0 0 24 24" class="w-7 h-7" fill="currentColor"><path d="M20.5 3.5A11.6 11.6 0 0 0 12 0C5.4 0 .1 5.3.1 11.9c0 2.1.6 4.2 1.6 6L0 24l6.3-1.7c1.7.9 3.7 1.4 5.6 1.4 6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.3-8.3z"/></svg>
    <span x-show="!open" class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
    <span x-show="!open" class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full"></span>
  </button>
</div>
<style>[x-cloak]{display:none!important}</style>
