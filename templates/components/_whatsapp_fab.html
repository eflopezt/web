<div x-data="{ open: false }" class="fixed bottom-5 right-5 z-50 print:hidden">
  <div x-show="open" x-transition x-cloak class="mb-3 w-72 bg-white rounded-xl border border-slate-200 shadow-soft overflow-hidden">
    <div class="bg-slate-900 px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-emerald-500 text-white flex items-center justify-center">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M20.5 3.5A11.6 11.6 0 0 0 12 0C5.4 0 .1 5.3.1 11.9c0 2.1.6 4.2 1.6 6L0 24l6.3-1.7c1.7.9 3.7 1.4 5.6 1.4 6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.3-8.3z"/></svg>
      </div>
      <div class="flex-1">
        <div class="font-semibold text-white text-sm">{{ SITE_NAME }} Ventas</div>
        <div class="text-xs text-slate-300 flex items-center gap-1.5"><span class="w-1.5 h-1.5 bg-emerald-400 rounded-full"></span> En línea</div>
      </div>
      <button @click="open=false" class="text-slate-400 hover:text-white text-lg leading-none">✕</button>
    </div>
    <div class="p-4 bg-slate-50">
      <div class="bg-white rounded-lg p-3 text-sm text-slate-700 border border-slate-200">
        ¡Hola! 👋 ¿En qué podemos ayudarte? Cotizaciones, soporte o consultas técnicas.
      </div>
      <a href="https://wa.me/{{ SITE_WHATSAPP }}?text=Hola%2C%20vengo%20de%20la%20web%20de%20{{ SITE_NAME|urlencode }}." target="_blank" rel="noopener" class="block w-full text-center bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2.5 rounded-lg mt-3 transition">
        Iniciar conversación →
      </a>
    </div>
  </div>

  <button @click="open=!open" :aria-expanded="open" aria-label="Chat WhatsApp" class="w-12 h-12 rounded-full bg-slate-900 hover:bg-slate-800 text-white flex items-center justify-center shadow-lg transition">
    <svg x-show="!open" viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M20.5 3.5A11.6 11.6 0 0 0 12 0C5.4 0 .1 5.3.1 11.9c0 2.1.6 4.2 1.6 6L0 24l6.3-1.7c1.7.9 3.7 1.4 5.6 1.4 6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.3-8.3z"/></svg>
    <svg x-show="open" x-cloak class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
  </button>
</div>
<style>[x-cloak]{display:none!important}</style>
