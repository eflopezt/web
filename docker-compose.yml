services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///app/db.sqlite3}
      EMISOR_RAZON_SOCIAL: ${EMISOR_RAZON_SOCIAL:-LimpiaPro S.A.C.}
      EMISOR_RUC: ${EMISOR_RUC:-20612345678}
      EMISOR_DIRECCION: ${EMISOR_DIRECCION:-Av. Industrial 123, Lima}
      EMISOR_EMAIL: ${EMISOR_EMAIL:-ventas@limpiapro.pe}
      EMISOR_TELEFONO: ${EMISOR_TELEFONO:-+51 999 999 999}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - sqlite_data:/app/data
      - media_files:/app/media
      - static_files:/app/staticfiles
    command: >
      bash -c "python manage.py migrate &&
               python manage.py collectstatic --noinput &&
               gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"

volumes:
  sqlite_data:
  media_files:
  static_files:
