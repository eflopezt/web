<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="ProClean Servid Innova">
  <title>ProClean Servid Innova (versión blanca)</title>

  <!-- Banner inferior -->
  <path d="M 90,300
           C 90,470 290,510 450,510
           C 610,510 810,470 810,300
           C 810,255 770,225 700,225
           L 720,245
           C 760,255 780,285 780,310
           C 780,440 600,475 450,475
           C 300,475 120,440 120,310
           C 120,285 140,255 180,245
           L 200,225
           C 130,225 90,255 90,300 Z"
        fill="#ffffff" opacity="0.95"/>

  <!-- Banner superior -->
  <path d="M 100,265
           C 100,120 290,90 450,90
           C 610,90 800,120 800,265
           C 800,305 760,330 700,330
           L 720,310
           C 760,305 770,285 770,260
           C 770,150 600,125 450,125
           C 300,125 130,150 130,260
           C 130,285 140,305 180,310
           L 200,330
           C 140,330 100,305 100,265 Z"
        fill="#ffffff"/>

  <!-- Edificios -->
  <g transform="translate(370,90)" fill="#ffffff" opacity="0.92">
    <rect x="0" y="140" width="20" height="60"/>
    <rect x="22" y="110" width="26" height="90"/>
    <polygon points="50,60 78,60 78,200 50,200"/>
    <polygon points="80,30 110,30 96,200 80,200"/>
    <rect x="112" y="80" width="22" height="120"/>
    <rect x="136" y="50" width="20" height="150"/>
    <rect x="158" y="100" width="26" height="100"/>
    <rect x="186" y="130" width="22" height="70"/>
  </g>

  <!-- Destellos -->
  <g transform="translate(290,180)" fill="#ffffff">
    <path d="M 0,-22 L 5,-5 L 22,0 L 5,5 L 0,22 L -5,5 L -22,0 L -5,-5 Z"/>
    <path d="M 38,12 L 42,24 L 54,28 L 42,32 L 38,44 L 34,32 L 22,28 L 34,24 Z" opacity="0.9"/>
    <path d="M 70,4 L 73,12 L 81,15 L 73,18 L 70,26 L 67,18 L 59,15 L 67,12 Z" opacity="0.85"/>
  </g>

  <!-- Texto -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-style="italic" fill="#ffffff">
    <text x="230" y="335" font-size="120" letter-spacing="-2">Pro</text>
    <text x="430" y="335" font-size="120" letter-spacing="-2">Clean</text>
  </g>

  <text x="450" y="395"
        text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="36"
        letter-spacing="6"
        fill="#ffffff" opacity="0.92">SERVID INNOVA</text>

  <!-- Hoja -->
  <g transform="translate(265,400)" fill="#ffffff" opacity="0.95">
    <path d="M 0,0 C -20,-25 10,-55 70,-58 C 130,-55 165,-30 170,0 C 165,15 130,28 70,30 C 10,28 -10,15 0,0 Z"/>
    <path d="M -5,-2 C 40,-20 110,-20 168,-2" stroke="#1A4F8B" stroke-width="2" fill="none" opacity="0.4"/>
  </g>
</svg>
