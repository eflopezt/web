<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ProClean">
  <defs>
    <linearGradient id="mark-ribbonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A4F8B"/>
      <stop offset="55%" stop-color="#1B75BC"/>
      <stop offset="100%" stop-color="#2BA0E0"/>
    </linearGradient>
    <linearGradient id="mark-ribbonGreen" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E8B1F"/>
      <stop offset="55%" stop-color="#3FAE2A"/>
      <stop offset="100%" stop-color="#6BCB3A"/>
    </linearGradient>
    <linearGradient id="mark-bldgGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6BCB3A"/>
      <stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="mark-bldgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2BA0E0"/>
      <stop offset="100%" stop-color="#1A4F8B"/>
    </linearGradient>
  </defs>

  <!-- Anillo exterior verde+azul (circular) -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#mark-ribbonGreen)" stroke-width="10"/>
  <path d="M 100,192 A 92,92 0 0,1 8,100" fill="none" stroke="url(#mark-ribbonBlue)" stroke-width="10" stroke-linecap="round"/>

  <!-- Skyline edificios centrado -->
  <g transform="translate(58,42)">
    <rect x="0" y="42" width="9" height="40" fill="url(#mark-bldgGreen)"/>
    <rect x="10" y="28" width="12" height="54" fill="url(#mark-bldgGreen)"/>
    <rect x="23" y="6" width="14" height="76" fill="url(#mark-bldgGreen)"/>
    <polygon points="38,16 52,16 52,82 38,82" fill="url(#mark-bldgGreen)"/>
    <rect x="53" y="24" width="11" height="58" fill="url(#mark-bldgBlue)"/>
    <rect x="65" y="10" width="10" height="72" fill="url(#mark-bldgBlue)"/>
    <rect x="76" y="32" width="13" height="50" fill="url(#mark-bldgBlue)"/>

    <!-- Ventanas -->
    <g fill="#ffffff" opacity="0.40">
      <rect x="2" y="52" width="5" height="2"/>
      <rect x="2" y="62" width="5" height="2"/>
      <rect x="13" y="38" width="6" height="2"/>
      <rect x="13" y="52" width="6" height="2"/>
      <rect x="13" y="66" width="6" height="2"/>
      <rect x="26" y="20" width="8" height="2"/>
      <rect x="26" y="36" width="8" height="2"/>
      <rect x="26" y="52" width="8" height="2"/>
      <rect x="26" y="68" width="8" height="2"/>
      <rect x="41" y="30" width="8" height="2"/>
      <rect x="41" y="48" width="8" height="2"/>
      <rect x="41" y="66" width="8" height="2"/>
      <rect x="56" y="38" width="6" height="2"/>
      <rect x="56" y="54" width="6" height="2"/>
      <rect x="56" y="70" width="6" height="2"/>
      <rect x="67" y="22" width="6" height="2"/>
      <rect x="67" y="42" width="6" height="2"/>
      <rect x="67" y="62" width="6" height="2"/>
      <rect x="79" y="44" width="7" height="2"/>
      <rect x="79" y="60" width="7" height="2"/>
    </g>
  </g>

  <!-- Destellos -->
  <g transform="translate(46,68)">
    <path d="M 0,-9 L 2.2,-2.2 L 9,0 L 2.2,2.2 L 0,9 L -2.2,2.2 L -9,0 L -2.2,-2.2 Z" fill="#ffffff"/>
    <path d="M 14,12 L 15.5,7 L 20,5.5 L 15.5,4 L 14,-1 L 12.5,4 L 8,5.5 L 12.5,7 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Hoja -->
  <g transform="translate(58,138)">
    <path d="M 0,8 C 8,-8 30,-14 60,-12 C 70,2 60,16 30,18 C 10,18 -4,16 0,8 Z" fill="url(#mark-ribbonGreen)"/>
    <path d="M 2,9 C 22,3 50,3 60,7" stroke="#ffffff" stroke-width="1.4" fill="none" opacity="0.9"/>
  </g>
