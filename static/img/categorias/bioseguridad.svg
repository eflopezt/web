<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">Bioseguridad</title>
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2BA0E0"/>
      <stop offset="1" stop-color="#1A4F8B"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7AD83C"/>
      <stop offset="1" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="gShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FAE2A"/>
      <stop offset="1" stop-color="#2E8B1F"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="28" fill="#E6F3FB"/>
  <!-- Escudo -->
  <path d="M100 30 L150 50 L150 100 Q150 140 100 170 Q50 140 50 100 L50 50 Z" fill="url(#gShield)"/>
  <!-- Brillo escudo -->
  <path d="M70 56 L100 44 L100 158 Q72 138 70 100 Z" fill="#ffffff" opacity=".15"/>
  <!-- Gota grande blanca dentro -->
  <path d="M100 60 Q78 100 88 124 Q92 138 100 138 Q108 138 112 124 Q122 100 100 60 Z" fill="#ffffff"/>
  <!-- Núcleo gota azul -->
  <path d="M100 80 Q90 104 95 120 Q97 128 100 128 Q103 128 105 120 Q110 104 100 80 Z" fill="url(#gBlue)" opacity=".85"/>
  <!-- Brillo gota -->
  <ellipse cx="92" cy="100" rx="4" ry="12" fill="#ffffff" opacity=".55"/>
  <!-- Botella gel pequeña (con bomba) abajo izquierda -->
  <rect x="22" y="138" width="22" height="38" rx="3" fill="url(#gBlue)" stroke="#1A4F8B" stroke-width="1.5"/>
  <rect x="26" y="148" width="14" height="14" rx="2" fill="#ffffff"/>
  <rect x="29" y="153" width="8" height="2" fill="#3FAE2A"/>
  <rect x="29" y="158" width="6" height="2" fill="#1B75BC"/>
  <rect x="29" y="132" width="8" height="8" fill="#1A4F8B"/>
  <path d="M33 124 L33 134 M28 128 L38 128" stroke="#1A4F8B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Termómetro abajo derecha -->
  <rect x="158" y="100" width="10" height="60" rx="5" fill="#ffffff" stroke="#1A4F8B" stroke-width="1.5"/>
  <rect x="160" y="115" width="6" height="42" rx="3" fill="#3FAE2A"/>
  <circle cx="163" cy="168" r="12" fill="url(#gGreen)" stroke="#1A4F8B" stroke-width="1.5"/>
  <rect x="160" y="155" width="6" height="14" fill="#3FAE2A"/>
  <!-- Marcas termómetro -->
  <g stroke="#1A4F8B" stroke-width="1" opacity=".6">
    <line x1="170" y1="110" x2="174" y2="110"/>
    <line x1="170" y1="120" x2="174" y2="120"/>
    <line x1="170" y1="130" x2="174" y2="130"/>
    <line x1="170" y1="140" x2="174" y2="140"/>
  </g>
</svg>
