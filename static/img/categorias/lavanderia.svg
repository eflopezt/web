<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">Lavandería</title>
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2BA0E0"/>
      <stop offset="1" stop-color="#1A4F8B"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7AD83C"/>
      <stop offset="1" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe4f3"/>
    </linearGradient>
    <radialGradient id="gDrum" cx=".5" cy=".5" r=".55">
      <stop offset="0" stop-color="#2BA0E0"/>
      <stop offset="1" stop-color="#1A4F8B"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="28" fill="#E6F3FB"/>
  <!-- Cuerpo lavadora -->
  <rect x="36" y="34" width="128" height="140" rx="12" fill="url(#gBody)" stroke="#1B75BC" stroke-width="2"/>
  <!-- Panel superior -->
  <rect x="46" y="44" width="108" height="22" rx="4" fill="#1B75BC" opacity=".15"/>
  <!-- Indicadores -->
  <circle cx="58" cy="55" r="3.5" fill="#3FAE2A"/>
  <circle cx="70" cy="55" r="3.5" fill="#1B75BC"/>
  <rect x="92" y="50" width="56" height="10" rx="3" fill="#ffffff" stroke="#1B75BC" stroke-width="1.5"/>
  <rect x="96" y="53" width="22" height="4" rx="2" fill="#3FAE2A"/>
  <!-- Puerta circular (frontal) -->
  <circle cx="100" cy="120" r="44" fill="#ffffff" stroke="#1B75BC" stroke-width="3"/>
  <circle cx="100" cy="120" r="36" fill="url(#gDrum)"/>
  <!-- Burbujas dentro -->
  <circle cx="86" cy="108" r="8" fill="#ffffff" opacity=".85"/>
  <circle cx="108" cy="104" r="6" fill="#ffffff" opacity=".7"/>
  <circle cx="116" cy="124" r="9" fill="#ffffff" opacity=".85"/>
  <circle cx="90" cy="130" r="5" fill="#ffffff" opacity=".7"/>
  <circle cx="102" cy="134" r="4" fill="#ffffff" opacity=".55"/>
  <!-- Manija puerta -->
  <rect x="138" y="116" width="12" height="8" rx="2" fill="#3FAE2A"/>
  <!-- Burbujas fuera (vapor) -->
  <circle cx="156" cy="40" r="6" fill="#ffffff" stroke="#3FAE2A" stroke-width="2"/>
  <circle cx="170" cy="56" r="4" fill="#ffffff" stroke="#1B75BC" stroke-width="2"/>
  <circle cx="32" cy="50" r="5" fill="#ffffff" stroke="#3FAE2A" stroke-width="2"/>
  <circle cx="22" cy="68" r="3.5" fill="#ffffff" stroke="#1B75BC" stroke-width="2"/>
</svg>
