  <!-- LENTES centro -->
  <rect x="44" y="100" width="112" height="22" rx="11" fill="url(#gBlue)"/>
  <!-- Lente izquierdo -->
  <ellipse cx="74" cy="111" rx="20" ry="9" fill="#1A4F8B"/>
  <ellipse cx="74" cy="111" rx="16" ry="6.5" fill="#2BA0E0"/>
  <ellipse cx="70" cy="108" rx="5" ry="3" fill="#ffffff" opacity=".7"/>
  <!-- Lente derecho -->
  <ellipse cx="126" cy="111" rx="20" ry="9" fill="#1A4F8B"/>
  <ellipse cx="126" cy="111" rx="16" ry="6.5" fill="#2BA0E0"/>
  <ellipse cx="122" cy="108" rx="5" ry="3" fill="#ffffff" opacity=".7"/>
  <!-- Puente -->
  <rect x="94" y="108" width="12" height="6" fill="#1A4F8B"/>
  <!-- MASCARILLA abajo -->
  <path d="M40 140 Q40 132 50 132 L150 132 Q160 132 160 140 L160 168 Q160 178 150 180 Q100 188 50 180 Q40 178 40 168 Z" fill="#ffffff" stroke="#1B75BC" stroke-width="2"/>
