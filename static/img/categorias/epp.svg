  <path d="M52 78 Q52 38 100 38 Q148 38 148 78 L148 84 L52 84 Z" fill="url(#gHelmet)"/>
  <!-- Borde casco -->
  <rect x="44" y="80" width="112" height="10" rx="4" fill="#1A4F8B"/>
