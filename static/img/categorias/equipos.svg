<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">Equipos y Maquinaria</title>
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2BA0E0"/>
      <stop offset="1" stop-color="#1A4F8B"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7AD83C"/>
      <stop offset="1" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="gTank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B75BC"/>
      <stop offset="1" stop-color="#1A4F8B"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="28" fill="#E6F3FB"/>
  <!-- Tanque cilíndrico aspiradora industrial -->
  <ellipse cx="100" cy="74" rx="44" ry="12" fill="#2BA0E0"/>
  <path d="M56 74 L56 148 Q56 156 64 156 L136 156 Q144 156 144 148 L144 74" fill="url(#gTank)" stroke="#1A4F8B" stroke-width="2"/>
  <ellipse cx="100" cy="74" rx="44" ry="12" fill="none" stroke="#1A4F8B" stroke-width="2"/>
  <!-- Banda lateral verde -->
  <rect x="56" y="108" width="88" height="14" fill="url(#gGreen)"/>
  <!-- Etiqueta blanca -->
  <rect x="80" y="128" width="40" height="20" rx="3" fill="#ffffff"/>
  <rect x="86" y="134" width="28" height="3" rx="1.5" fill="#1B75BC"/>
  <rect x="86" y="140" width="20" height="3" rx="1.5" fill="#3FAE2A"/>
  <!-- Asa superior -->
  <path d="M86 60 Q100 44 114 60" stroke="#1A4F8B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Boquilla de salida (manguera) -->
  <path d="M144 100 Q170 100 172 130 Q174 155 156 168" stroke="url(#gBlue)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Boquilla punta -->
  <rect x="148" y="160" width="18" height="14" rx="2" fill="#1A4F8B" transform="rotate(20 157 167)"/>
  <!-- Ruedas -->
  <circle cx="68" cy="170" r="10" fill="#1A4F8B"/>
  <circle cx="68" cy="170" r="4" fill="#3FAE2A"/>
  <circle cx="132" cy="170" r="10" fill="#1A4F8B"/>
  <circle cx="132" cy="170" r="4" fill="#3FAE2A"/>
  <!-- Botón encendido -->
  <circle cx="100" cy="92" r="7" fill="#ffffff"/>
  <circle cx="100" cy="92" r="3.5" fill="#3FAE2A"/>
  <!-- Brillo -->
  <ellipse cx="80" cy="80" rx="6" ry="40" fill="#ffffff" opacity=".25"/>
</svg>
