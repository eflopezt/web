<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="ProClean Servid Innova">
  <title>ProClean Servid Innova — versión horizontal</title>

  <defs>
    <linearGradient id="hz-ribbonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A4F8B"/>
      <stop offset="55%" stop-color="#1B75BC"/>
      <stop offset="100%" stop-color="#2BA0E0"/>
    </linearGradient>
    <linearGradient id="hz-ribbonGreen" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E8B1F"/>
      <stop offset="55%" stop-color="#3FAE2A"/>
      <stop offset="100%" stop-color="#6BCB3A"/>
    </linearGradient>
    <linearGradient id="hz-bldgGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6BCB3A"/>
      <stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="hz-bldgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2BA0E0"/>
      <stop offset="100%" stop-color="#1A4F8B"/>
    </linearGradient>
  </defs>

  <!-- ============ IMAGOTIPO IZQUIERDA (versión circular compacta) ============ -->
  <g transform="translate(60,60)">
    <!-- Anillo verde superior + azul inferior -->
    <path d="M 0,-52 A 52,52 0 0,1 52,0" fill="none" stroke="url(#hz-ribbonGreen)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0,-52 A 52,52 0 0,0 -52,0" fill="none" stroke="url(#hz-ribbonGreen)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 52,0 A 52,52 0 0,1 0,52" fill="none" stroke="url(#hz-ribbonBlue)" stroke-width="6" stroke-linecap="round"/>
    <path d="M -52,0 A 52,52 0 0,0 0,52" fill="none" stroke="url(#hz-ribbonBlue)" stroke-width="6" stroke-linecap="round"/>

    <!-- Edificios variados -->
    <g transform="translate(-26,-32)">
      <rect x="0" y="26" width="5" height="20" fill="url(#hz-bldgGreen)"/>
      <rect x="6" y="16" width="7" height="30" fill="url(#hz-bldgGreen)"/>
      <rect x="14" y="2" width="9" height="44" fill="url(#hz-bldgGreen)"/>
      <polygon points="24,10 32,10 32,46 24,46" fill="url(#hz-bldgGreen)"/>
      <rect x="33" y="14" width="7" height="32" fill="url(#hz-bldgBlue)"/>
      <polygon points="41,6 49,6 49,46 41,46" fill="url(#hz-bldgBlue)"/>
      <polygon points="41,6 45,2 49,6" fill="url(#hz-bldgBlue)"/>
      <rect x="50" y="18" width="8" height="28" fill="url(#hz-bldgBlue)"/>
    </g>

    <!-- Destellos -->
    <g transform="translate(-28,8)" fill="#ffffff">
      <path d="M 0,-6 L 1.5,-1.5 L 6,0 L 1.5,1.5 L 0,6 L -1.5,1.5 L -6,0 L -1.5,-1.5 Z"/>
      <path d="M 9,7 L 10.2,3.5 L 13.5,2.5 L 10.2,1.5 L 9,-2 L 7.8,1.5 L 4.5,2.5 L 7.8,3.5 Z" opacity="0.9"/>
      <path d="M 16,-3 L 17,0 L 20,1 L 17,2 L 16,5 L 15,2 L 12,1 L 15,0 Z" opacity="0.8"/>
    </g>

    <!-- Hoja almendra -->
    <g transform="translate(-20,32)">
      <path d="M 0,4 C 3,-6 18,-10 38,-8 C 46,-4 44,6 30,10 C 14,12 -2,10 0,4 Z" fill="url(#hz-ribbonGreen)"/>
      <path d="M 2,5 C 14,1 30,1 38,4" stroke="#ffffff" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.9"/>
      <path d="M 12,4 C 14,7 14,9 12,11" stroke="#ffffff" stroke-width="0.6" fill="none" opacity="0.55"/>
      <path d="M 24,2 C 26,6 26,9 24,11" stroke="#ffffff" stroke-width="0.6" fill="none" opacity="0.55"/>
    </g>
  </g>

  <!-- ============ TEXTO A LA DERECHA ============ -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-style="italic">
    <text x="135" y="70" font-size="56" fill="#3FAE2A" letter-spacing="-1">Pro</text>
    <text x="232" y="70" font-size="56" fill="#1B75BC" letter-spacing="-1">Clean</text>
  </g>

  <text x="135" y="95"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="14"
        letter-spacing="3"
        fill="#1A4F8B">SERVID INNOVA</text>
</svg>
