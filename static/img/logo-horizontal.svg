<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="ProClean Servid Innova">
  <title>ProClean Servid Innova</title>

  <defs>
    <linearGradient id="hz-ribbonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A4F8B"/>
      <stop offset="55%" stop-color="#1B75BC"/>
      <stop offset="100%" stop-color="#2BA0E0"/>
    </linearGradient>
    <linearGradient id="hz-ribbonGreen" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E8B1F"/>
      <stop offset="55%" stop-color="#3FAE2A"/>
      <stop offset="100%" stop-color="#6BCB3A"/>
    </linearGradient>
    <linearGradient id="hz-bldgGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6BCB3A"/>
      <stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="hz-bldgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2BA0E0"/>
      <stop offset="100%" stop-color="#1A4F8B"/>
    </linearGradient>
  </defs>

  <!-- Imagotipo (izquierda, contenido en círculo) -->
  <g transform="translate(60,60)">
    <!-- Anillo circular -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="url(#hz-ribbonGreen)" stroke-width="6"/>
    <path d="M 0,52 A 52,52 0 0,1 -52,0" fill="none" stroke="url(#hz-ribbonBlue)" stroke-width="6" stroke-linecap="round"/>

    <!-- Edificios -->
    <g transform="translate(-23,-30)">
      <rect x="0" y="22" width="5" height="22" fill="url(#hz-bldgGreen)"/>
      <rect x="6" y="14" width="7" height="30" fill="url(#hz-bldgGreen)"/>
      <rect x="14" y="2" width="8" height="42" fill="url(#hz-bldgGreen)"/>
      <polygon points="23,8 30,8 30,44 23,44" fill="url(#hz-bldgGreen)"/>
      <rect x="31" y="12" width="6" height="32" fill="url(#hz-bldgBlue)"/>
      <rect x="38" y="4" width="6" height="40" fill="url(#hz-bldgBlue)"/>
      <rect x="45" y="18" width="7" height="26" fill="url(#hz-bldgBlue)"/>
    </g>

    <!-- Destellos -->
    <g transform="translate(-28,8)" fill="#ffffff">
      <path d="M 0,-5 L 1.2,-1.2 L 5,0 L 1.2,1.2 L 0,5 L -1.2,1.2 L -5,0 L -1.2,-1.2 Z"/>
      <path d="M 9,7 L 10,3.5 L 13.5,2.5 L 10,1.5 L 9,-2 L 8,1.5 L 4.5,2.5 L 8,3.5 Z" opacity="0.9"/>
    </g>

    <!-- Hoja -->
    <g transform="translate(-18,33)">
      <path d="M 0,4 C 5,-5 18,-9 35,-7 C 40,1 35,9 18,10 C 6,10 -2,9 0,4 Z" fill="url(#hz-ribbonGreen)"/>
      <path d="M 2,5 C 14,1 30,1 36,3" stroke="#ffffff" stroke-width="0.9" fill="none" opacity="0.85"/>
    </g>
  </g>

  <!-- Texto a la derecha -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-style="italic">
    <text x="135" y="70" font-size="56" fill="#3FAE2A" letter-spacing="-1">Pro</text>
    <text x="232" y="70" font-size="56" fill="#1B75BC" letter-spacing="-1">Clean</text>
  </g>

  <text x="135" y="95"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="14"
        letter-spacing="3"
        fill="#1A4F8B">SERVID INNOVA</text>
</svg>
