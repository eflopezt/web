<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-label="ProClean Servid Innova">
  <title>ProClean Servid Innova</title>
  <defs>
    <linearGradient id="hz-rb" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#143F73"/><stop offset="50%" stop-color="#1B75BC"/><stop offset="100%" stop-color="#2BA0E0"/>
    </linearGradient>
    <linearGradient id="hz-rg" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#236914"/><stop offset="50%" stop-color="#3FAE2A"/><stop offset="100%" stop-color="#7AD83C"/>
    </linearGradient>
    <linearGradient id="hz-bG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86E548"/><stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="hz-bB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC0EC"/><stop offset="100%" stop-color="#143F73"/>
    </linearGradient>
    <linearGradient id="hz-tG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6BCB3A"/><stop offset="100%" stop-color="#236914"/>
    </linearGradient>
    <linearGradient id="hz-tB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2BA0E0"/><stop offset="100%" stop-color="#143F73"/>
    </linearGradient>
    <linearGradient id="hz-lf" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#86E548"/><stop offset="100%" stop-color="#236914"/>
    </linearGradient>
  </defs>

  <!-- Imagotipo circular envolvente -->
  <g transform="translate(70,70)">
    <circle cx="0" cy="0" r="58" fill="none" stroke="url(#hz-rg)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 0,58 A 58,58 0 0,1 -58,0" fill="none" stroke="url(#hz-rb)" stroke-width="7" stroke-linecap="round"/>

    <!-- Skyline (8 edificios miniaturizados) -->
    <g transform="translate(-27,-35)">
      <rect x="0" y="36" width="5" height="20" fill="url(#hz-bG)"/>
      <rect x="6" y="28" width="6" height="28" fill="url(#hz-bG)"/>
      <rect x="13" y="14" width="8" height="42" fill="url(#hz-bG)"/>
      <rect x="22" y="4" width="7" height="52" fill="url(#hz-bG)"/>
      <rect x="30" y="12" width="6" height="44" fill="url(#hz-bB)"/>
      <rect x="37" y="0" width="8" height="56" fill="url(#hz-bB)"/>
      <rect x="46" y="16" width="7" height="40" fill="url(#hz-bB)"/>
      <rect x="54" y="22" width="5" height="34" fill="url(#hz-bB)"/>
    </g>

    <!-- Destellos -->
    <g transform="translate(-32,5)" fill="#ffffff">
      <path d="M 0,-6 L 1.4,-1.4 L 6,0 L 1.4,1.4 L 0,6 L -1.4,1.4 L -6,0 L -1.4,-1.4 Z"/>
      <path d="M 10,7 L 11,3.5 L 14,2.5 L 11,1.5 L 10,-2 L 9,1.5 L 6,2.5 L 9,3.5 Z" opacity="0.9"/>
    </g>

    <!-- Hoja -->
    <g transform="translate(-22,38)">
      <path d="M -2,3 C 2,-8 16,-12 32,-10 C 44,-6 44,4 32,8 C 14,10 -2,8 -2,3 Z" fill="url(#hz-lf)"/>
      <path d="M 0,3 C 12,-4 28,-6 38,-2" stroke="#ffffff" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>

  <!-- Texto -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-style="italic">
    <text x="148" y="80" font-size="62" fill="url(#hz-tG)" letter-spacing="-1.8">Pro</text>
    <text x="254" y="80" font-size="62" fill="url(#hz-tB)" letter-spacing="-1.8">Clean</text>
  </g>
  <text x="148" y="108"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="16" letter-spacing="4"
        fill="#143F73">SERVID INNOVA</text>
</svg>
