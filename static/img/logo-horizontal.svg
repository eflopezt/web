<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" role="img" aria-label="ProClean Servid Innova">
  <title>ProClean Servid Innova</title>
  <defs>
    <linearGradient id="hz-ribbonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A4F8B"/><stop offset="100%" stop-color="#2BA0E0"/>
    </linearGradient>
    <linearGradient id="hz-ribbonGreen" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E8B1F"/><stop offset="100%" stop-color="#6BCB3A"/>
    </linearGradient>
    <linearGradient id="hz-bldgGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7AD83C"/><stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="hz-bldgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3DB5E8"/><stop offset="100%" stop-color="#1A4F8B"/>
    </linearGradient>
    <linearGradient id="hz-textG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5DC42E"/><stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="hz-textB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2BA0E0"/><stop offset="100%" stop-color="#1A4F8B"/>
    </linearGradient>
  </defs>

  <!-- Imagotipo circular -->
  <g transform="translate(65,65)">
    <circle cx="0" cy="0" r="56" fill="none" stroke="url(#hz-ribbonGreen)" stroke-width="6"/>
    <path d="M 0,56 A 56,56 0 0,1 -56,0" fill="none" stroke="url(#hz-ribbonBlue)" stroke-width="6" stroke-linecap="round"/>

    <!-- Edificios rectangulares -->
    <g transform="translate(-25,-32)">
      <rect x="0" y="32" width="5" height="22" fill="url(#hz-bldgGreen)"/>
      <rect x="6" y="22" width="7" height="32" fill="url(#hz-bldgGreen)"/>
      <rect x="14" y="6" width="8" height="48" fill="url(#hz-bldgGreen)"/>
      <rect x="23" y="0" width="7" height="54" fill="url(#hz-bldgGreen)"/>
      <rect x="31" y="14" width="6" height="40" fill="url(#hz-bldgBlue)"/>
      <rect x="38" y="4" width="8" height="50" fill="url(#hz-bldgBlue)"/>
      <rect x="47" y="20" width="6" height="34" fill="url(#hz-bldgBlue)"/>
    </g>

    <!-- Destellos -->
    <g transform="translate(-30,8)" fill="#ffffff">
      <path d="M 0,-5 L 1.2,-1.2 L 5,0 L 1.2,1.2 L 0,5 L -1.2,1.2 L -5,0 L -1.2,-1.2 Z"/>
      <path d="M 9,7 L 10,3.5 L 13.5,2.5 L 10,1.5 L 9,-2 L 8,1.5 L 4.5,2.5 L 8,3.5 Z" opacity="0.9"/>
    </g>

    <!-- Hoja -->
    <g transform="translate(-22,35)">
      <path d="M -2,3 C 0,-5 14,-9 28,-9 C 38,-7 38,3 28,7 C 14,9 0,7 -2,3 Z" fill="url(#hz-ribbonGreen)"/>
      <path d="M 0,3 C 10,-2 24,-4 32,-1" stroke="#ffffff" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <!-- Texto -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-style="italic">
    <text x="140" y="75" font-size="58" fill="url(#hz-textG)" letter-spacing="-1.5">Pro</text>
    <text x="240" y="75" font-size="58" fill="url(#hz-textB)" letter-spacing="-1.5">Clean</text>
  </g>
  <text x="140" y="100"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="15" letter-spacing="3.5"
        fill="#1A4F8B">SERVID INNOVA</text>
</svg>
