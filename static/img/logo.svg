<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="ProClean Servid Innova">
  <title>ProClean Servid Innova</title>
  <desc>Imagotipo: listón ovalado verde y azul que envuelve un skyline urbano, destellos de limpieza y una hoja eco. Logotipo ProClean (verde + azul) sobre tagline SERVID INNOVA.</desc>

  <defs>
    <!-- Curva inferior azul (de oscuro a claro, izq->der) -->
    <linearGradient id="ribbonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A4F8B"/>
      <stop offset="55%" stop-color="#1B75BC"/>
      <stop offset="100%" stop-color="#2BA0E0"/>
    </linearGradient>
    <!-- Curva superior verde (de oscuro a claro, der->izq) -->
    <linearGradient id="ribbonGreen" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E8B1F"/>
      <stop offset="55%" stop-color="#3FAE2A"/>
      <stop offset="100%" stop-color="#6BCB3A"/>
    </linearGradient>
    <!-- Edificios verde (izquierda) -->
    <linearGradient id="bldgGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6BCB3A"/>
      <stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <!-- Edificios azul (derecha) -->
    <linearGradient id="bldgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2BA0E0"/>
      <stop offset="100%" stop-color="#1A4F8B"/>
    </linearGradient>
    <!-- Hoja verde -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BCB3A"/>
      <stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <!-- Brillo suave en hoja -->
    <linearGradient id="leafShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Destello -->
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#E6F3FB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1B75BC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================= LISTÓN ENVOLVENTE =================
       Dos cintas que se cruzan formando un óvalo:
       - La azul nace abajo-izquierda, recorre la base y sube por la derecha
       - La verde nace arriba-izquierda, recorre el techo y baja por la derecha
       Cada cinta es un "shape relleno" (path cerrado con borde exterior y borde interior)
       que termina en una punta donde se entrelaza con la otra cinta. -->

  <!-- Cinta azul (base + extremos curvos hacia arriba) -->
  <path d="M 92,298
           C 90,420 200,498 450,508
           C 700,498 810,420 808,298
           C 805,250 762,222 700,222
           C 693,222 686,224 680,228
           L 706,247
           C 712,246 718,246 723,247
           C 758,254 778,278 778,310
           C 778,418 626,472 450,472
           C 274,472 122,418 122,310
           C 122,278 142,254 177,247
           C 182,246 188,246 194,247
           L 220,228
           C 214,224 207,222 200,222
           C 138,222 95,250 92,298 Z"
        fill="url(#ribbonBlue)"/>

  <!-- Cinta verde (techo + extremos curvos hacia abajo) -->
  <path d="M 100,262
           C 102,140 230,90 450,86
           C 670,90 798,140 800,262
           C 800,308 760,332 700,332
           C 692,332 685,330 680,326
           L 706,308
           C 712,309 718,309 723,308
           C 758,302 770,282 770,260
           C 770,160 620,124 450,124
           C 280,124 130,160 130,260
           C 130,282 142,302 177,308
           C 182,309 188,309 194,308
           L 220,326
           C 214,330 207,332 200,332
           C 140,332 100,308 100,262 Z"
        fill="url(#ribbonGreen)"/>

  <!-- Sombra suave bajo el entrelazado izquierdo (verde sobre azul) -->
  <path d="M 200,222 L 220,228 L 194,247 L 177,247 Z" fill="#1A4F8B" opacity="0.25"/>
  <!-- Sombra suave bajo el entrelazado derecho (verde sobre azul) -->
  <path d="M 700,222 L 680,228 L 706,247 L 723,247 Z" fill="#1A4F8B" opacity="0.25"/>

  <!-- ================= SKYLINE EDIFICIOS =================
       Edificios variados en altura, anchura y techo.
       Izquierda en verde, derecha en azul. -->
  <g transform="translate(370,90)">
    <!-- Reflejo sutil debajo (efecto agua/superficie limpia) -->
    <g opacity="0.16" transform="translate(0,200) scale(1,-1)">
      <rect x="0" y="0" width="18" height="58" fill="url(#bldgGreen)"/>
      <rect x="20" y="0" width="24" height="92" fill="url(#bldgGreen)"/>
      <rect x="46" y="0" width="32" height="138" fill="url(#bldgGreen)"/>
      <polygon points="80,0 110,0 96,168 80,168" fill="url(#bldgGreen)"/>
      <rect x="112" y="0" width="22" height="120" fill="url(#bldgBlue)"/>
      <polygon points="136,0 158,0 158,152 146,168 136,152" fill="url(#bldgBlue)"/>
      <rect x="160" y="0" width="26" height="102" fill="url(#bldgBlue)"/>
      <rect x="188" y="0" width="22" height="68" fill="url(#bldgBlue)"/>
    </g>

    <!-- Edificios reales (verde izq → azul der) -->
    <!-- 1. Bajo achaparrado -->
    <rect x="0" y="142" width="18" height="58" fill="url(#bldgGreen)"/>
    <!-- 2. Medio -->
    <rect x="20" y="108" width="24" height="92" fill="url(#bldgGreen)"/>
    <!-- 3. Alto plano -->
    <rect x="46" y="62" width="32" height="138" fill="url(#bldgGreen)"/>
    <!-- 4. Pico (techo diagonal hacia adentro) -->
    <polygon points="80,32 110,32 96,200 80,200" fill="url(#bldgGreen)"/>
    <!-- 5. Mediano azul -->
    <rect x="112" y="80" width="22" height="120" fill="url(#bldgBlue)"/>
    <!-- 6. Alto con techo a dos aguas suave -->
    <polygon points="136,48 158,48 158,200 146,200 146,200 136,200" fill="url(#bldgBlue)"/>
    <polygon points="136,48 146,38 158,48" fill="url(#bldgBlue)"/>
    <!-- 7. Medio -->
    <rect x="160" y="98" width="26" height="102" fill="url(#bldgBlue)"/>
    <!-- 8. Bajo -->
    <rect x="188" y="132" width="22" height="68" fill="url(#bldgBlue)"/>

    <!-- Ventanas (líneas blancas) -->
    <g fill="#ffffff" opacity="0.38">
      <rect x="4" y="155" width="10" height="3"/>
      <rect x="4" y="175" width="10" height="3"/>
      <rect x="24" y="122" width="16" height="3"/>
      <rect x="24" y="142" width="16" height="3"/>
      <rect x="24" y="162" width="16" height="3"/>
      <rect x="24" y="182" width="16" height="3"/>
      <rect x="50" y="78" width="24" height="3"/>
      <rect x="50" y="102" width="24" height="3"/>
      <rect x="50" y="126" width="24" height="3"/>
      <rect x="50" y="150" width="24" height="3"/>
      <rect x="50" y="174" width="24" height="3"/>
      <rect x="86" y="56" width="14" height="3"/>
      <rect x="86" y="90" width="14" height="3"/>
      <rect x="86" y="124" width="14" height="3"/>
      <rect x="86" y="158" width="14" height="3"/>
      <rect x="86" y="188" width="14" height="3"/>
      <rect x="116" y="100" width="14" height="3"/>
      <rect x="116" y="130" width="14" height="3"/>
      <rect x="116" y="160" width="14" height="3"/>
      <rect x="116" y="186" width="14" height="3"/>
      <rect x="140" y="70" width="14" height="3"/>
      <rect x="140" y="100" width="14" height="3"/>
      <rect x="140" y="130" width="14" height="3"/>
      <rect x="140" y="160" width="14" height="3"/>
      <rect x="140" y="186" width="14" height="3"/>
      <rect x="164" y="116" width="18" height="3"/>
      <rect x="164" y="142" width="18" height="3"/>
      <rect x="164" y="168" width="18" height="3"/>
      <rect x="164" y="190" width="18" height="3"/>
      <rect x="192" y="148" width="14" height="3"/>
      <rect x="192" y="172" width="14" height="3"/>
      <rect x="192" y="192" width="14" height="3"/>
    </g>
  </g>

  <!-- ================= DESTELLOS / SPARKLES =================
       3 estrellas de 4 puntas, decrecientes, a la izquierda del skyline.
       Sugieren limpieza y brillo. -->
  <g transform="translate(290,180)">
    <!-- Destello grande -->
    <g transform="translate(0,0)">
      <circle cx="0" cy="0" r="18" fill="url(#sparkle)" opacity="0.55"/>
      <path d="M 0,-24 L 5.5,-5.5 L 24,0 L 5.5,5.5 L 0,24 L -5.5,5.5 L -24,0 L -5.5,-5.5 Z" fill="#ffffff"/>
    </g>
    <!-- Destello mediano -->
    <g transform="translate(38,28)">
      <circle cx="0" cy="0" r="12" fill="url(#sparkle)" opacity="0.55"/>
      <path d="M 0,-17 L 4,-4 L 17,0 L 4,4 L 0,17 L -4,4 L -17,0 L -4,-4 Z" fill="#ffffff"/>
    </g>
    <!-- Destello pequeño -->
    <g transform="translate(72,2)">
      <circle cx="0" cy="0" r="8" fill="url(#sparkle)" opacity="0.6"/>
      <path d="M 0,-12 L 3,-3 L 12,0 L 3,3 L 0,12 L -3,3 L -12,0 L -3,-3 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= TEXTO PROCLEAN ================= -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-style="italic">
    <!-- "Pro" verde -->
    <text x="230" y="335" font-size="120" fill="#3FAE2A" letter-spacing="-2">Pro</text>
    <!-- "Clean" azul -->
    <text x="430" y="335" font-size="120" fill="#1B75BC" letter-spacing="-2">Clean</text>
  </g>

  <!-- "SERVID INNOVA" -->
  <text x="450" y="395"
        text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="36"
        letter-spacing="6"
        fill="#1A4F8B">SERVID INNOVA</text>

  <!-- ================= HOJA VERDE (forma de gota/almendra) =================
       Forma orgánica con punta a la derecha, base redondeada a la izquierda.
       Vena central curva + 5 venas laterales emergiendo de ella. -->
  <g transform="translate(255,395)">
    <!-- Hoja principal: forma de almendra con punta -->
    <path d="M 0,8
             C -8,-14 18,-44 70,-50
             C 122,-52 160,-32 178,-2
             C 172,12 138,28 78,32
             C 32,32 6,24 0,8 Z"
          fill="url(#leafGreen)"/>
    <!-- Brillo superior sutil para volumen -->
    <path d="M 8,-2
             C 4,-18 28,-38 70,-44
             C 110,-44 145,-28 158,-8
             C 130,-22 90,-26 50,-22
             C 28,-18 14,-10 8,-2 Z"
          fill="url(#leafShine)" opacity="0.55"/>
    <!-- Vena central curva (recorre la hoja de base a punta) -->
    <path d="M -2,4
             C 30,-22 80,-30 130,-20
             C 152,-14 168,-6 178,-2"
          stroke="#ffffff" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- Venas laterales: 5 venas saliendo de la vena central hacia el borde -->
    <path d="M 18,-6 C 22,2 24,8 22,16" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 48,-18 C 56,-8 60,0 58,12" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 82,-26 C 90,-14 94,-4 94,10" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 118,-22 C 124,-12 126,-2 124,10" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 150,-14 C 152,-6 150,2 146,8" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
