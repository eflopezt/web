<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="ProClean Servid Innova">
  <title>ProClean Servid Innova</title>
  <desc>Imagotipo: óvalo verde y azul con skyline urbano, hoja y destellos. Logotipo ProClean en verde y azul con tagline SERVID INNOVA.</desc>

  <defs>
    <!-- Curva inferior azul -->
    <linearGradient id="ribbonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A4F8B"/>
      <stop offset="55%" stop-color="#1B75BC"/>
      <stop offset="100%" stop-color="#2BA0E0"/>
    </linearGradient>
    <!-- Curva superior verde -->
    <linearGradient id="ribbonGreen" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E8B1F"/>
      <stop offset="55%" stop-color="#3FAE2A"/>
      <stop offset="100%" stop-color="#6BCB3A"/>
    </linearGradient>
    <!-- Edificios verde (izquierda) -->
    <linearGradient id="bldgGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6BCB3A"/>
      <stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <!-- Edificios azul (derecha) -->
    <linearGradient id="bldgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2BA0E0"/>
      <stop offset="100%" stop-color="#1A4F8B"/>
    </linearGradient>
    <!-- Hoja verde -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BCB3A"/>
      <stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <!-- Destello -->
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#E6F3FB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1B75BC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================= ÓVALO ENVOLVENTE ================= -->
  <!-- Banner azul: curva inferior + sale por arriba en los extremos -->
  <path d="M 90,300
           C 90,470 290,510 450,510
           C 610,510 810,470 810,300
           C 810,255 770,225 700,225
           L 720,245
           C 760,255 780,285 780,310
           C 780,440 600,475 450,475
           C 300,475 120,440 120,310
           C 120,285 140,255 180,245
           L 200,225
           C 130,225 90,255 90,300 Z"
        fill="url(#ribbonBlue)"/>

  <!-- Banner verde: curva superior, pasa por encima -->
  <path d="M 100,265
           C 100,120 290,90 450,90
           C 610,90 800,120 800,265
           C 800,305 760,330 700,330
           L 720,310
           C 760,305 770,285 770,260
           C 770,150 600,125 450,125
           C 300,125 130,150 130,260
           C 130,285 140,305 180,310
           L 200,330
           C 140,330 100,305 100,265 Z"
        fill="url(#ribbonGreen)"/>

  <!-- ================= SKYLINE EDIFICIOS ================= -->
  <g transform="translate(370,90)">
    <!-- Reflejo sutil de los edificios -->
    <g opacity="0.18" transform="translate(0,200) scale(1,-1)">
      <rect x="0" y="0" width="20" height="60" fill="url(#bldgGreen)"/>
      <rect x="22" y="0" width="26" height="90" fill="url(#bldgGreen)"/>
      <polygon points="50,0 78,0 78,140 50,140" fill="url(#bldgGreen)"/>
      <polygon points="80,0 110,0 96,170 80,170" fill="url(#bldgGreen)"/>
      <rect x="112" y="0" width="22" height="120" fill="url(#bldgBlue)"/>
      <rect x="136" y="0" width="20" height="150" fill="url(#bldgBlue)"/>
      <rect x="158" y="0" width="26" height="100" fill="url(#bldgBlue)"/>
      <rect x="186" y="0" width="22" height="70" fill="url(#bldgBlue)"/>
    </g>

    <!-- Edificios reales -->
    <rect x="0" y="140" width="20" height="60" fill="url(#bldgGreen)"/>
    <rect x="22" y="110" width="26" height="90" fill="url(#bldgGreen)"/>
    <polygon points="50,60 78,60 78,200 50,200" fill="url(#bldgGreen)"/>
    <polygon points="80,30 110,30 96,200 80,200" fill="url(#bldgGreen)"/>
    <rect x="112" y="80" width="22" height="120" fill="url(#bldgBlue)"/>
    <rect x="136" y="50" width="20" height="150" fill="url(#bldgBlue)"/>
    <rect x="158" y="100" width="26" height="100" fill="url(#bldgBlue)"/>
    <rect x="186" y="130" width="22" height="70" fill="url(#bldgBlue)"/>

    <!-- Líneas de ventanas (toques de detalle) -->
    <g fill="#ffffff" opacity="0.35">
      <rect x="6" y="155" width="8" height="3"/>
      <rect x="6" y="175" width="8" height="3"/>
      <rect x="28" y="125" width="14" height="3"/>
      <rect x="28" y="145" width="14" height="3"/>
      <rect x="28" y="165" width="14" height="3"/>
      <rect x="56" y="80" width="16" height="3"/>
      <rect x="56" y="110" width="16" height="3"/>
      <rect x="56" y="140" width="16" height="3"/>
      <rect x="56" y="170" width="16" height="3"/>
      <rect x="86" y="55" width="14" height="3"/>
      <rect x="86" y="90" width="14" height="3"/>
      <rect x="86" y="125" width="14" height="3"/>
      <rect x="86" y="160" width="14" height="3"/>
      <rect x="116" y="100" width="14" height="3"/>
      <rect x="116" y="130" width="14" height="3"/>
      <rect x="116" y="160" width="14" height="3"/>
      <rect x="140" y="75" width="12" height="3"/>
      <rect x="140" y="105" width="12" height="3"/>
      <rect x="140" y="135" width="12" height="3"/>
      <rect x="140" y="165" width="12" height="3"/>
      <rect x="162" y="120" width="18" height="3"/>
      <rect x="162" y="150" width="18" height="3"/>
      <rect x="162" y="180" width="18" height="3"/>
      <rect x="190" y="150" width="14" height="3"/>
      <rect x="190" y="175" width="14" height="3"/>
    </g>
  </g>

  <!-- ================= DESTELLOS / SPARKLES ================= -->
  <g transform="translate(290,180)">
    <!-- 4-point star helper via two rotated diamonds -->
    <g transform="translate(0,0)">
      <path d="M 0,-22 L 5,-5 L 22,0 L 5,5 L 0,22 L -5,5 L -22,0 L -5,-5 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="14" fill="url(#sparkle)" opacity="0.55"/>
    </g>
    <g transform="translate(38,28)">
      <path d="M 0,-16 L 4,-4 L 16,0 L 4,4 L 0,16 L -4,4 L -16,0 L -4,-4 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="10" fill="url(#sparkle)" opacity="0.55"/>
    </g>
    <g transform="translate(70,4)">
      <path d="M 0,-11 L 3,-3 L 11,0 L 3,3 L 0,11 L -3,3 L -11,0 L -3,-3 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="7" fill="url(#sparkle)" opacity="0.6"/>
    </g>
  </g>

  <!-- ================= TEXTO PROCLEAN ================= -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-style="italic">
    <!-- "Pro" verde -->
    <text x="230" y="335" font-size="120" fill="#3FAE2A" letter-spacing="-2">Pro</text>
    <!-- "Clean" azul -->
    <text x="430" y="335" font-size="120" fill="#1B75BC" letter-spacing="-2">Clean</text>
  </g>

  <!-- "SERVID INNOVA" -->
  <text x="450" y="395"
        text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="36"
        letter-spacing="6"
        fill="#1A4F8B">SERVID INNOVA</text>

  <!-- ================= HOJA VERDE ================= -->
  <g transform="translate(265,400)">
    <!-- Hoja principal -->
    <path d="M 0,0
             C -20,-25 10,-55 70,-58
             C 130,-55 165,-30 170,0
             C 165,15 130,28 70,30
             C 10,28 -10,15 0,0 Z"
          fill="url(#leafGreen)"/>
    <!-- Vena central -->
    <path d="M -5,-2 C 40,-20 110,-20 168,-2"
          stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>
    <!-- Venas laterales -->
    <path d="M 30,-15 C 40,-8 50,-3 55,4" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.45"/>
    <path d="M 70,-18 C 78,-8 80,-2 82,5" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.45"/>
    <path d="M 110,-17 C 115,-8 115,-2 113,5" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.45"/>
    <path d="M 140,-13 C 142,-5 140,0 137,6" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.45"/>
  </g>
</svg>
