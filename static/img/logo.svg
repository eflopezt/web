<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="ProClean Servid Innova">
  <title>ProClean Servid Innova</title>
  <desc>Imagotipo: listón ovalado verde y azul que envuelve un skyline urbano, destellos y una hoja eco. Logotipo ProClean (verde + azul) sobre tagline SERVID INNOVA.</desc>

  <defs>
    <linearGradient id="ribbonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A4F8B"/>
      <stop offset="55%" stop-color="#1B75BC"/>
      <stop offset="100%" stop-color="#2BA0E0"/>
    </linearGradient>
    <linearGradient id="ribbonGreen" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E8B1F"/>
      <stop offset="55%" stop-color="#3FAE2A"/>
      <stop offset="100%" stop-color="#6BCB3A"/>
    </linearGradient>
    <linearGradient id="bldgGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7AD83C"/>
      <stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="bldgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3DB5E8"/>
      <stop offset="100%" stop-color="#1A4F8B"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AD83C"/>
      <stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="leafShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sparkleCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#E6F3FB" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1B75BC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5DC42E"/>
      <stop offset="100%" stop-color="#2E8B1F"/>
    </linearGradient>
    <linearGradient id="textBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2BA0E0"/>
      <stop offset="100%" stop-color="#1A4F8B"/>
    </linearGradient>
  </defs>

  <!-- ================= LISTÓN ENVOLVENTE — más fluido y delgado ================= -->
  <!-- Cinta azul (base) -->
  <path d="M 100,300
           C 100,440 240,505 450,508
           C 660,505 800,440 800,300
           C 800,258 762,232 706,232
           C 700,232 694,234 690,238
           L 712,254
           C 716,253 720,253 724,254
           C 752,260 770,280 770,308
           C 770,408 620,460 450,460
           C 280,460 130,408 130,308
           C 130,280 148,260 176,254
           C 180,253 184,253 188,254
           L 210,238
           C 206,234 200,232 194,232
           C 138,232 100,258 100,300 Z"
        fill="url(#ribbonBlue)"/>

  <!-- Cinta verde (techo) -->
  <path d="M 100,260
           C 100,140 240,92 450,90
           C 660,92 800,140 800,260
           C 800,302 762,328 706,328
           C 700,328 694,326 690,322
           L 712,306
           C 716,307 720,307 724,306
           C 752,300 770,280 770,252
           C 770,152 620,120 450,120
           C 280,120 130,152 130,252
           C 130,280 148,300 176,306
           C 180,307 184,307 188,306
           L 210,322
           C 206,326 200,328 194,328
           C 138,328 100,302 100,260 Z"
        fill="url(#ribbonGreen)"/>

  <!-- Entrelazado izquierdo (sombra para profundidad) -->
  <path d="M 194,232 L 210,238 L 188,254 L 176,254 Z" fill="#0F3D6E" opacity="0.30"/>
  <!-- Entrelazado derecho -->
  <path d="M 706,232 L 690,238 L 712,254 L 724,254 Z" fill="#0F3D6E" opacity="0.30"/>

  <!-- ================= SKYLINE EDIFICIOS — rectángulos limpios sin techos diagonales ================= -->
  <g transform="translate(355,82)">
    <!-- Reflejo invertido sutil bajo los edificios -->
    <g opacity="0.14" transform="translate(0,205) scale(1,-1)">
      <rect x="0" y="0" width="20" height="55" fill="url(#bldgGreen)"/>
      <rect x="22" y="0" width="26" height="85" fill="url(#bldgGreen)"/>
      <rect x="50" y="0" width="34" height="135" fill="url(#bldgGreen)"/>
      <rect x="86" y="0" width="28" height="165" fill="url(#bldgGreen)"/>
      <rect x="116" y="0" width="24" height="115" fill="url(#bldgBlue)"/>
      <rect x="142" y="0" width="32" height="150" fill="url(#bldgBlue)"/>
      <rect x="176" y="0" width="22" height="100" fill="url(#bldgBlue)"/>
      <rect x="200" y="0" width="20" height="70" fill="url(#bldgBlue)"/>
    </g>

    <!-- Edificios principales: rectángulos limpios, gradient claro→oscuro -->
    <rect x="0" y="150" width="20" height="55" fill="url(#bldgGreen)"/>
    <rect x="22" y="120" width="26" height="85" fill="url(#bldgGreen)"/>
    <rect x="50" y="70" width="34" height="135" fill="url(#bldgGreen)"/>
    <rect x="86" y="40" width="28" height="165" fill="url(#bldgGreen)"/>
    <rect x="116" y="90" width="24" height="115" fill="url(#bldgBlue)"/>
    <rect x="142" y="55" width="32" height="150" fill="url(#bldgBlue)"/>
    <rect x="176" y="105" width="22" height="100" fill="url(#bldgBlue)"/>
    <rect x="200" y="135" width="20" height="70" fill="url(#bldgBlue)"/>

    <!-- Ventanas: líneas horizontales blancas finas -->
    <g fill="#ffffff" opacity="0.40">
      <rect x="4" y="162" width="12" height="2.5"/>
      <rect x="4" y="180" width="12" height="2.5"/>
      <rect x="26" y="132" width="18" height="2.5"/>
      <rect x="26" y="152" width="18" height="2.5"/>
      <rect x="26" y="172" width="18" height="2.5"/>
      <rect x="54" y="82" width="26" height="2.5"/>
      <rect x="54" y="104" width="26" height="2.5"/>
      <rect x="54" y="126" width="26" height="2.5"/>
      <rect x="54" y="148" width="26" height="2.5"/>
      <rect x="54" y="170" width="26" height="2.5"/>
      <rect x="90" y="52" width="20" height="2.5"/>
      <rect x="90" y="76" width="20" height="2.5"/>
      <rect x="90" y="100" width="20" height="2.5"/>
      <rect x="90" y="124" width="20" height="2.5"/>
      <rect x="90" y="148" width="20" height="2.5"/>
      <rect x="90" y="172" width="20" height="2.5"/>
      <rect x="120" y="102" width="16" height="2.5"/>
      <rect x="120" y="124" width="16" height="2.5"/>
      <rect x="120" y="146" width="16" height="2.5"/>
      <rect x="120" y="170" width="16" height="2.5"/>
      <rect x="146" y="68" width="24" height="2.5"/>
      <rect x="146" y="90" width="24" height="2.5"/>
      <rect x="146" y="112" width="24" height="2.5"/>
      <rect x="146" y="134" width="24" height="2.5"/>
      <rect x="146" y="156" width="24" height="2.5"/>
      <rect x="146" y="178" width="24" height="2.5"/>
      <rect x="180" y="118" width="14" height="2.5"/>
      <rect x="180" y="140" width="14" height="2.5"/>
      <rect x="180" y="162" width="14" height="2.5"/>
      <rect x="180" y="184" width="14" height="2.5"/>
      <rect x="204" y="148" width="12" height="2.5"/>
      <rect x="204" y="170" width="12" height="2.5"/>
    </g>
  </g>

  <!-- ================= DESTELLOS — 3 estrellas diamante ================= -->
  <g transform="translate(290,175)">
    <!-- Destello grande -->
    <g>
      <path d="M 0,-22 L 5,-5 L 22,0 L 5,5 L 0,22 L -5,5 L -22,0 L -5,-5 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="14" fill="url(#sparkleCore)" opacity="0.6"/>
    </g>
    <!-- Destello mediano -->
    <g transform="translate(36,24)">
      <path d="M 0,-14 L 3,-3 L 14,0 L 3,3 L 0,14 L -3,3 L -14,0 L -3,-3 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="9" fill="url(#sparkleCore)" opacity="0.55"/>
    </g>
    <!-- Destello chico -->
    <g transform="translate(60,-8)">
      <path d="M 0,-9 L 2,-2 L 9,0 L 2,2 L 0,9 L -2,2 L -9,0 L -2,-2 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="6" fill="url(#sparkleCore)" opacity="0.55"/>
    </g>
  </g>

  <!-- ================= TEXTO PROCLEAN ================= -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-style="italic">
    <text x="225" y="345" font-size="125" fill="url(#textGreen)" letter-spacing="-3">Pro</text>
    <text x="425" y="345" font-size="125" fill="url(#textBlue)" letter-spacing="-3">Clean</text>
  </g>

  <!-- "SERVID INNOVA" — tracking amplio -->
  <text x="450" y="403"
        text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="38"
        letter-spacing="8"
        fill="#1A4F8B">SERVID INNOVA</text>

  <!-- ================= HOJA VERDE DOBLE ================= -->
  <g transform="translate(255,405)">
    <!-- Hoja principal (almendra grande) -->
    <path d="M -10,8
             C -22,-12 0,-44 50,-52
             C 110,-58 168,-38 180,-4
             C 174,12 142,30 78,34
             C 22,34 -4,24 -10,8 Z"
          fill="url(#leafGreen)"/>
    <!-- Brillo superior de la hoja -->
    <path d="M -10,8
             C -22,-12 0,-44 50,-52
             C 110,-58 168,-38 180,-4
             C 130,-20 60,-22 -10,8 Z"
          fill="url(#leafShine)"/>
    <!-- Vena central blanca curvada -->
    <path d="M -8,4 C 30,-22 90,-30 140,-22 C 160,-18 174,-10 180,-4"
          stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.92"/>
    <!-- Venas laterales -->
    <path d="M 20,-22 C 28,-12 32,-2 30,10" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 55,-30 C 64,-18 68,-6 66,8" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 95,-32 C 102,-20 104,-6 100,8" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 130,-28 C 134,-16 132,-4 126,8" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 158,-22 C 160,-12 156,-2 152,6" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
